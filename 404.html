<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<script>
  // Super Voice's pages were here, under /super-stt/ and then /super-voice/,
  // and are now at super-libre.github.io/super-voice/. GitHub Pages doesn't
  // redirect a renamed or moved repo's site, so this page does.
  (function () {
    var l = window.location;
    var m = l.pathname.match(/^\/super-(?:stt|voice)(\/.*)?$/);
    if (m) {
      l.replace("https://super-libre.github.io/super-voice" + (m[1] || "/") + l.search + l.hash);
    }
  })();
</script>
<style>
  :root { --fg: #1f2328; --bg: #ffffff; --link: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6edf3; --bg: #0d1117; --link: #4493f8; }
  }
  body {
    font-family: system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
    max-width: 36rem;
    margin: 4rem auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  a { color: var(--link); }
</style>
</head>
<body>
<h1>Page not found</h1>
<p>Looking for Super Voice? It's at <a href="https://super-libre.github.io/super-voice/">super-libre.github.io/super-voice</a>.</p>
</body>
</html>
